[workspace]
members = [
    "nipaw_cnb",
    "nipaw_core",
    "nipaw_gitcode",
    "nipaw_gitee",
    "nipaw_github",
    "nipaw_node"
]
resolver = "2"
exclude = ["nipaw_cli"]

[workspace.package]
authors = ["wuliya <3369906077@qq.com>"]
license = "LGPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/puniyu/nipaw"
repository = "https://github.com/puniyu/nipaw"
edition = "2024"
rust-version = "1.88.0"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = { version = "0.5.0", features = ["rustls", "query", "form", "json"] }
chrono = { version = "0.4.42", features = ["serde"] }
jiff = { version = "0.2.38", features = ["serde"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
http = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
itertools = "0.15.0"
futures = "0.3.34"
tokio = "1.53.2"

[profile.release]
lto = true
strip = "symbols"
